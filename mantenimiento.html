<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo en Actualización | Grupo SEG Consulting</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        .mantenimiento-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            background: #f8fafc;
        }
        .mantenimiento-card {
            background: #ffffff;
            padding: 50px 30px;
            max-width: 600px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border-top: 5px solid #d32f2f;
        }
        .mantenimiento-icon {
            font-size: 55px;
            color: #d32f2f;
            margin-bottom: 20px;
        }
        .mantenimiento-card h1 {
            font-size: 1.6rem;
            color: #10222E;
            margin-bottom: 16px;
        }
        .mantenimiento-card p {
            color: #555;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-regresar {
            display: inline-block;
            background: #10222E;
            color: #fff;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        .btn-regresar:hover {
            background: #009186;
        }
    </style>
</head>
<body>
    <main class="mantenimiento-wrapper">
        <div class="mantenimiento-card">
            <div class="mantenimiento-icon">
                <i class="fas fa-tools"></i>
            </div>
            <h1>Estamos trabajando para brindarte un mejor servicio</h1>
            <p>Disculpe las molestias. Estamos optimizando esta plataforma para ofrecerle una experiencia más rápida, segura y alineada a los más altos estándares tecnológicos.</p>
            <a href="index.html" class="btn-regresar"><i class="fas fa-arrow-left"></i> Volver a la página principal</a>
        </div>
    </main>
</body>
</html>
